<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-center"><h4 class="mb-0">Modificar Usuario</h4><small>Variante v2: edición con datos precargados</small></div>
            <div class="card-body">
                <div class="alert alert-danger">Username ya existe (simula validación PHP <code>existeUsername()</code>).</div>
                <form onsubmit="alert('Simula UPDATE usuarios + sincronizarRolesUsuario'); return false;">
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" class="form-control" required value="directivo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nueva clave (dejar vacío para no cambiar)</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="passwordUsuario2" placeholder="(vacío = no cambia)">
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordUsuario2"><i class="bi bi-eye" id="toggleIconUsuario2"></i></button>
                        </div>
                        <div class="form-text">Se guarda con <code>password_hash()</code>.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roles</label>
                        <div class="border rounded p-2 bg-white">
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="rol1b"><label class="form-check-label" for="rol1b">Administrador <span class="badge bg-danger">tipo 1</span></label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" checked id="rol2b"><label class="form-check-label" for="rol2b">Directivo <span class="badge bg-primary">tipo 2</span></label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="rol3b"><label class="form-check-label" for="rol3b">Operador <span class="badge bg-secondary">tipo 3</span></label></div>
                        </div>
                    </div>
                    <div class="d-grid"><button type="submit" class="btn btn-warning">Guardar cambios</button></div>
                    <div class="d-grid mt-2"><a href="editUsuario.html" class="btn btn-outline-secondary">Cancelar edición</a></div>
                </form>
            </div>
            <div class="card-footer text-center"><a href="viewUsuario.html" class="btn btn-outline-warning">Ver usuarios</a></div>
        </div>
    </div></div></div>
    <footer class="bg-dark text-white text-center py-3 mt-5"><div class="container"><small class="text-white-50">Etapa 4 v2</small></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('togglePasswordUsuario2').addEventListener('click', function(){
            const input=document.getElementById('passwordUsuario2'); const icon=document.getElementById('toggleIconUsuario2');
            const isPass=input.type==='password'; input.type=isPass?'text':'password';
            icon.classList.toggle('bi-eye',!isPass); icon.classList.toggle('bi-eye-slash',isPass);
        });
    </script>
</body>
</html>
