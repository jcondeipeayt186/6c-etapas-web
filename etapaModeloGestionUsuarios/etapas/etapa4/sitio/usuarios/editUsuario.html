<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin (Administrador)</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-warning text-center"><h4 class="mb-0">Nuevo Usuario</h4><small>HTML estático — simula alta</small></div>
            <div class="card-body">
                <form onsubmit="alert('En ETAPA 4 no guarda en BD. En ETAPA 5 haría POST a gestionUsuario.php con password_hash'); return false;">
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" class="form-control" required placeholder="ej: juanperez">
                        <div class="form-text">Debe ser único, sin espacios.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Clave *</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="passwordUsuario" required placeholder="mínimo 4 caracteres">
                            <button class="btn btn-outline-secondary" type="button" id="togglePasswordUsuario"><i class="bi bi-eye" id="toggleIconUsuario"></i></button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Roles (N:M — puede seleccionar varios)</label>
                        <div class="border rounded p-2 bg-white" style="max-height:180px; overflow-y:auto;">
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="rol1"><label class="form-check-label" for="rol1">Administrador <span class="badge bg-danger">tipo 1</span> <small class="text-muted">Acceso total</small></label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="rol2"><label class="form-check-label" for="rol2">Directivo <span class="badge bg-primary">tipo 2</span> <small class="text-muted">Gestiona personas/ciudades</small></label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" id="rol3"><label class="form-check-label" for="rol3">Operador <span class="badge bg-secondary">tipo 3</span> <small class="text-muted">Sin módulos</small></label></div>
                        </div>
                        <div class="form-text">En ETAPA 5 se guarda en <code>usuarios</code> + <code>usuario_rol</code>.</div>
                    </div>
                    <div class="d-grid"><button type="submit" class="btn btn-primary">Crear usuario</button></div>
                </form>
            </div>
            <div class="card-footer text-center">
                <a href="viewUsuario.html" class="btn btn-outline-warning">Ver usuarios</a>
                <a href="../home/index.html" class="btn btn-outline-secondary">Inicio</a>
            </div>
        </div>
        <p class="text-center small mt-2"><a href="editUsuario-v2.html">Ver variante v2: edición con datos precargados y error</a></p>
    </div></div></div>
    <footer class="bg-dark text-white text-center py-3 mt-5"><div class="container"><small class="text-white-50">Etapa 4 — HTML estático</small></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('togglePasswordUsuario').addEventListener('click', function(){
            const input=document.getElementById('passwordUsuario'); const icon=document.getElementById('toggleIconUsuario');
            const isPass=input.type==='password'; input.type=isPass?'text':'password';
            icon.classList.toggle('bi-eye',!isPass); icon.classList.toggle('bi-eye-slash',isPass);
        });
    </script>
</body>
</html>
