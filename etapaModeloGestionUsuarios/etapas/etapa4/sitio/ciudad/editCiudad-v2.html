<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Ciudad - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-info text-white text-center"><h4 class="mb-0">Editar Ciudad</h4><small>Variante v2: edición precargada (id=1) + error</small></div>
            <div class="card-body">
                <div class="alert alert-danger">La latitud debe ser un número entre -90 y 90 (ej: -31.416667) <br><small>Simula validación PHP en gestionCiudad.php antes del UPDATE.</small></div>
                <form onsubmit="alert('Simula UPDATE ciudades SET nombre... WHERE id=1'); return false;">
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" required value="Río Cuarto"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Provincia</label><input type="text" class="form-control" required value="Córdoba"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Latitud</label><input type="number" step="any" class="form-control" value="999"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Longitud</label><input type="number" step="any" class="form-control" value="-64.349924"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Código Postal</label><input type="text" class="form-control" value="5800"></div>
                    <div class="mb-3"><label class="form-label">Fecha de Fundación</label><input type="date" class="form-control" value="1786-11-11"></div>
                    <div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" rows="3">Ciudad del sur de Córdoba, capital alterna</textarea></div>
                    <div class="d-grid"><button type="submit" class="btn btn-warning">Guardar cambios</button></div>
                </form>
            </div>
            <div class="card-footer text-center"><a href="viewCiudad.html" class="btn btn-outline-info">Volver a ciudades</a></div>
        </div>
    </div></div></div>
    <footer class="bg-dark text-white text-center py-3 mt-5"><div class="container"><small class="text-white-50">Etapa 4 v2 — Simula ?id=1 + SELECT + validación</small></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
