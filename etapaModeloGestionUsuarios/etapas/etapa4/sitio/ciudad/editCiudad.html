<body class="bg-light">

    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-info text-white text-center"><h4 class="mb-0">Nueva Ciudad</h4><small>HTML estático — alta</small></div>
            <div class="card-body">
                <form onsubmit="alert('ETAPA 4: no hace INSERT. En ETAPA 5 POST a gestionCiudad.php → INSERT INTO ciudades'); return false;">
                    <div class="row">

                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Latitud</label><input type="number" step="any" class="form-control" placeholder="Ej: -33.123456"></div>

                    <div class="mb-3"><label class="form-label">Código Postal</label><input type="text" class="form-control" placeholder="Ej: 5800"></div>

                    <div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" rows="3" placeholder="Opcional"></textarea></div>

            </div>
