<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Rol - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-7">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center"><h4 class="mb-0">Modificar Rol</h4><small>Variante v2: edición precargada</small></div>
            <div class="card-body">
                <div class="alert alert-danger">Ya existe un rol con ese nombre (simula <code>existeRolNombre()</code>).</div>
                <form onsubmit="alert('Simula UPDATE roles SET nombre... WHERE id=?'); return false;">
                    <div class="mb-3"><label class="form-label">Nombre *</label><input type="text" class="form-control" required value="Operador"></div>
                    <div class="mb-3"><label class="form-label">Descripción</label><textarea class="form-control" rows="2">Usuario operativo sin módulos</textarea></div>
                    <div class="mb-3"><label class="form-label">Tipo</label><select class="form-select"><option>1 - Admin</option><option>2 - Directivo</option><option selected>3 - Operador</option></select></div>
                    <div class="d-grid"><button type="submit" class="btn btn-warning">Guardar cambios</button></div>
                    <div class="d-grid mt-2"><a href="editRol.html" class="btn btn-outline-secondary">Cancelar</a></div>
                </form>
            </div>
            <div class="card-footer text-center"><a href="viewRol.html" class="btn btn-outline-dark">Ver roles</a></div>
        </div>
    </div></div></div>
</body>
</html>
