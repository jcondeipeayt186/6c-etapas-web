<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Persona - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center"><h4 class="mb-0">Modificar Persona</h4><small>Variante v2: edición precargada (id=2)</small></div>
            <div class="card-body">
                <form onsubmit="alert('Simula UPDATE personas SET nombre... WHERE id=2'); return false;">
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" required value="María"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Apellido</label><input type="text" class="form-control" required value="Pérez"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">DNI</label><input type="text" class="form-control" required value="31333456"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">CUIT</label><input type="text" class="form-control" required value="27313334569"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Nac.</label><input type="date" class="form-control" required value="1987-05-12"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required value="maria.perez@gmail.com"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Teléfono</label><input type="tel" class="form-control" required value="3534111579"></div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Lugar de Nacimiento</label>
                            <select class="form-select" required>
                                <option value="">-- Seleccionar --</option>
                                <option value="1">Río Cuarto (Córdoba)</option>
                                <option value="2" selected>Córdoba (Córdoba)</option>
                                <option value="3">Villa María (Córdoba)</option>
                                <option value="7">Rosario (Santa Fe)</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3"><label class="form-label">Dirección</label><input type="text" class="form-control" required value="Belgrano 456"></div>
                    <div class="mb-3"><label class="form-label">Observaciones</label><textarea class="form-control" rows="3">Estudiante</textarea></div>
                    <div class="d-grid"><button type="submit" class="btn btn-warning">Guardar cambios</button></div>
                    <div class="d-grid mt-2"><a href="editPersona.html" class="btn btn-outline-secondary">Cancelar edición</a></div>
                </form>
            </div>
            <div class="card-footer text-center"><a href="viewPersona.html" class="btn btn-outline-success">Ver personas</a></div>
        </div>
    </div></div></div>
    <footer class="bg-dark text-white text-center py-3 mt-5"><div class="container"><small class="text-white-50">Etapa 4 v2 — Simula SELECT WHERE id=2 + precarga value="..."</small></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
