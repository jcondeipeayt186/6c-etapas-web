<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Persona - Etapa 4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4"><div class="container"><a class="navbar-brand" href="../home/index.html">Gestión 5</a><span class="navbar-text text-white">admin (Administrador)</span></div></nav>
    <div class="container pb-5"><div class="row justify-content-center"><div class="col-md-8">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center"><h4 class="mb-0">Nueva Persona</h4><small>HTML estático — alta</small></div>
            <div class="card-body">
                <form onsubmit="alert('ETAPA 4: no hace INSERT. En ETAPA 5 POST a gestionPersona.php → INSERT INTO personas'); return false;">
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" required placeholder="Ej: María"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Apellido</label><input type="text" class="form-control" required placeholder="Ej: Pérez"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">DNI</label><input type="text" class="form-control" required placeholder="Ej: 31333456"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">CUIT</label><input type="text" class="form-control" required placeholder="Ej: 27313334569"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Fecha Nac.</label><input type="date" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Email</label><input type="email" class="form-control" required placeholder="ej@correo.com"></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Teléfono</label><input type="tel" class="form-control" required placeholder="Ej: 3514123456"></div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Lugar de Nacimiento</label>
                            <select class="form-select" required>
                                <option value="">-- Seleccionar ciudad --</option>
                                <option>Río Cuarto (Córdoba)</option>
                                <option>Córdoba (Córdoba)</option>
                                <option>Villa María (Córdoba)</option>
                                <option>Rosario (Santa Fe)</option>
                                <option>La Plata (Buenos Aires)</option>
                            </select>
                            <div class="form-text">En ETAPA 5 este <code>&lt;select&gt;</code> se llena con <code>obtenerTodasLasCiudades()</code>.</div>
                        </div>
                    </div>
                    <div class="mb-3"><label class="form-label">Dirección</label><input type="text" class="form-control" required placeholder="Ej: Av. San Martín 123"></div>
                    <div class="mb-3"><label class="form-label">Observaciones</label><textarea class="form-control" rows="3" placeholder="Opcional"></textarea></div>
                    <div class="d-grid"><button type="submit" class="btn btn-primary">Crear persona</button></div>
                </form>
            </div>
            <div class="card-footer text-center"><a href="viewPersona.html" class="btn btn-outline-success">Ver personas</a><a href="../home/index.html" class="btn btn-outline-secondary">Inicio</a></div>
        </div>
        <p class="text-center small mt-2"><a href="editPersona-v2.html">Ver variante v2: edición con datos precargados</a></p>
    </div></div></div>
    <footer class="bg-dark text-white text-center py-3 mt-5"><div class="container"><small class="text-white-50">Etapa 4 — HTML estático</small></div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
